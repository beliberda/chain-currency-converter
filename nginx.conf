server {
    listen 80;
    listen [::]:80;
    server_name currency.papa-ya.app;

    # Redirect everything to HTTPS once certificates are issued (e.g. via certbot).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name currency.papa-ya.app;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/currency.papa-ya.app;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml;

    # The service worker file itself must never be cached, otherwise the
    # browser keeps running stale JS/CSS and auto-update never kicks in.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # HTML/manifest: revalidate on every load so a new deploy is seen quickly.
    location ~* \.(?:html|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed/static assets can be cached aggressively. If you don't fingerprint
    # filenames on build, keep this shorter (e.g. 1d) or bump a ?v= query param.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
